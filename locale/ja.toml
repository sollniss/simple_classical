"section.classical.label" = "クラシック判定"
"section.classical.note" = "リリースごとに、プラグインがタグ付けを行うかどうかを判定。いずれかのルール行に一致すればクラシックとみなされる。行は「必須」に設定したすべてのシグナルが成立し、「除外」に設定したシグナルがひとつも成立しない場合に一致する。このセクションが無効の場合は判定自体が行われず、すべてのリリースがタグ付けされ、判定結果のエクスポートも書き込みも行われない。有効な場合、判定結果は %_sc_classical%（各シグナルは %_sc_sig_...%）として Picard スクリプトにエクスポートされる。ジャンルシグナルには Picard の設定で「MusicBrainz のジャンルを使用」を有効にする必要がある。"
