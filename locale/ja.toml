"section.composer.label" = "作曲者"
"section.composer.note" = "演奏された作品の作曲者リレーションシップから取得し、標準の composer/composersort タグに書き込む。デフォルトでは既存の値を置き換える。保持するには別のルールを選択してください。"
"section.conductor.label" = "指揮者"
"section.conductor.note" = "標準の 'conductor' タグに書き込む。デフォルトでは既存の値を置き換える。保持するには別のルールを選択してください。"
"section.orchestra.label" = "オーケストラ"
"section.orchestra.note" = "'performing orchestra'（演奏オーケストラ）リレーションシップから取得する。'ensemble' は MPD、Roon、Squeezebox などのプレーヤーが解釈する一般的なタグで、'performer:orchestra' はこのリレーションシップに対する Picard 独自のタグ。"
"section.location.label" = "録音場所"
"section.location.note" = "録音の 'recorded at'（録音場所）リレーションシップから取得する（例: オルガンが演奏された教会）。'location' は MPD などが解釈できる。アルバムごとに MusicBrainz への追加リクエストが 1 回必要となる。"
"section.recdate.label" = "録音日"
"section.recdate.note" = "演奏リレーションシップの日付、または「recorded at」/「recorded in」リレーションシップの日付のうち、より精度の高い方を使用する（同じ精度の場合は演奏リレーションシップが優先される）。場所に紐づけられている日付の取得にはアルバムごとに MusicBrainz への追加リクエストが 1 回必要となる（録音場所セクションと共有）。演奏の日付がすでに日単位であれば省略される。"
