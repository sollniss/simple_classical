"section.classical.label" = "Klassik-Erkennung"
"section.classical.note" = "Entscheidet pro Veröffentlichung, ob das Plugin sie überhaupt taggt: die Veröffentlichung gilt als Klassik, wenn eine der Regelzeilen zutrifft; eine Zeile trifft zu, wenn jedes auf „erforderlich“ gesetzte Signal vorliegt und keines der auf „darf nicht“ gesetzten. Ist dieser Abschnitt deaktiviert, findet keine Erkennung statt: jede Veröffentlichung wird getaggt, und es wird kein Ergebnis exportiert oder geschrieben. Ist er aktiviert, wird das Ergebnis als %_sc_classical% an Picard-Skripte exportiert (einzelne Signale als %_sc_sig_...%). Das Genre-Signal benötigt „Genres von MusicBrainz verwenden“ in den Picard-Optionen."
"classical.genres" = "Genre-Stichwörter:"
"classical.scope" = "Beurteilen:"
"scope.track" = "Jeden Track einzeln"
"scope.release" = "Die Veröffentlichung als Ganzes"
"classical.scope_note" = "Pro Track wird jeder Track anhand seiner eigenen Aufnahme und seines eigenen Werks beurteilt, sodass bei einer gemischten Box nur der klassische Teil getaggt wird. Zwei Signale lassen sich so nicht aufteilen: das Genre ist eine Eigenschaft der Veröffentlichung, und eine Datei zählt nur dann für ihren eigenen Track, wenn sie MusicBrainz-IDs enthält."
