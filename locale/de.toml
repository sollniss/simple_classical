"classical.marker_note" = "Wird das Ergebnis in ein Tag geschrieben, erkennt es ein späterer Durchlauf über das Signal „Bereits getaggt“ wieder. Erkennung und Schreiben sind unabhänging voneinander, sodass eine Sammlung in einem Durchlauf auf ein neues Tag oder einen neuen Wert umgestellt werden kann. Ein leerer Erkennungswert trifft auf jeden Wert zu. Wird ein Ziel-Tag mit einem leeren Wert für das Ergebnis angegeben, wird das Tag entfernt. Das Ergebnis wird auch dann geschrieben, wenn dieser Abschnitt alle anderen Tags unterbindet."
