# German translation. Terminology follows Picard's German localization
# (Interpret, Veröffentlichung); MusicBrainz relationship and tag names
# stay in English because they refer to the actual data.

"section.title.label" = "Titel"
"section.title.note" = "Kanonisch = der Titel der Aufnahme, wie angegeben = der Titel des Tracks, wie er auf dieser Veröffentlichung gedruckt ist."
"section.artist.label" = "Interpret"
"section.artist.note" = "Die Künstlerangabe der Veröffentlichung, angepasst durch die folgenden Rollenregeln (Standard: Komponisten werden entfernt)."
"section.albumartist.label" = "Album-Interpret"
"section.artists.label" = "Interpreten"
"section.artists.note" = "Die vollständige Künstlerangabe der Veröffentlichung, einschließlich des Komponisten."
"section.composer.label" = "Komponist"
"section.composer.note" = "Aus der Komponisten-Beziehung des aufgeführten Werks, geschrieben in die Standard-Tags composer/composersort. Vorhandene Werte werden standardmäßig ersetzt; wählen Sie eine andere Regel, um sie zu erhalten."
"section.conductor.label" = "Dirigent"
"section.conductor.note" = "Geschrieben in das Standard-Tag 'conductor'. Vorhandene Werte werden standardmäßig ersetzt; wählen Sie eine andere Regel, um sie zu erhalten."
"section.orchestra.label" = "Orchester"
"section.orchestra.note" = "Aus der Beziehung 'performing orchestra'. 'ensemble' ist das Standard-Tag, das Player wie MPD, Roon oder Squeezebox verstehen; 'performer:orchestra' ist Picards eigenes Tag für diese Beziehung."
"section.location.label" = "Aufnahmeort"
"section.location.note" = "Aus der Orts-Beziehung 'recorded at' der Aufnahme (z. B. die Kirche, deren Orgel gespielt wurde). 'location' wird z. B. von MPD verstanden. Benötigt eine zusätzliche MusicBrainz-Anfrage pro Album."
"section.recdate.label" = "Aufnahmedatum"
"section.recdate.note" = "Aus den Daten der Aufführungs-Beziehung oder den Daten der Beziehungen „recorded at“/„recorded in“, je nachdem, welche genauer sind (bei gleicher Präzision gewinnt die Aufführungs-Beziehung). Das Prüfen der Ortsdaten benötigt eine zusätzliche MusicBrainz-Anfrage pro Album (gemeinsam mit dem Abschnitt Aufnahmeort) und entfällt, wenn die Aufführungsdaten bereits tagesgenau sind."
"section.work.label" = "Werk && Satz"
"section.key.label" = "Tonart"
"section.workyear.label" = "Kompositionsjahr"

