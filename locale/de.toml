"work.template_help" = "Vorlagen: %L1% = aufgeführtes Werk (tiefste Ebene), %L2%… = die übergeordneten Werke, %top% = oberstes Werk. Bereiche verbinden mehrere Ebenen: %top..L1{:: }% gibt sie in der geschriebenen Reihenfolge aus, verbunden mit dem Trennzeichen in den geschweiften Klammern (Standard '; '). Fehlende Ebenen werden als nichts ausgegeben. Tag-Listen können mehrere, durch ';' getrennte Tags enthalten. Die Hierarchie steht Picard-Skripten außerdem als %_sc_l1%…, %_sc_top%, %_sc_depth% und %_sc_partial% zur Verfügung."
