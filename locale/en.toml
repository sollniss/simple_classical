"section.classical.label" = "Classical detection"
"section.classical.note" = "Decides per release whether the plugin tags it at all: the release counts as classical if any rule row matches, and a row matches when every signal set to 'required' holds and none set to 'must not hold' does. With this section disabled nothing is detected: every release is tagged, and no verdict is exported or written. While it is enabled the verdict is exported to Picard scripts as %_sc_classical% (single signals as %_sc_sig_...%). The genre signal needs 'Use genres from MusicBrainz' enabled in Picard's options."
"classical.genres" = "Genre keywords:"
"classical.scope" = "Judge:"
"scope.track" = "Each track on its own"
"scope.release" = "The release as a whole"
"classical.scope_note" = "Per track, each track is judged on its own recording and work, so a mixed box set tags only the classical part of it. Two signals cannot be split that way: the genre is a property of the release, and a file only counts towards its own track if it carries MusicBrainz ids."
"classical.detect_tag" = "Detect from tag:"
"classical.detect_value" = "Detect tag value:"
"classical.col.composer" = "Work has composer"
"classical.col.conductor_orchestra" = "Conductor/orchestra"
"classical.col.composer_in_credit" = "Composer in credit"
"classical.col.genre" = "Classical genre"
"classical.col.multi_movement" = "Multi-movement work"
"classical.col.tagged" = "Already tagged"
"classical.cell.ignore" = "—"
"classical.cell.require" = "required"
"classical.cell.exclude" = "must not hold"
"classical.add_rule" = "Add rule"
"classical.remove_selected" = "Remove selected"
"classical.marker_note" = "Writing the verdict to a tag lets a later run pick it up again through the 'already tagged' signal, together with releases tagged by hand or by another plugin. Detection and writing name their tag separately, so a library can be moved to a new tag or value in one pass. An empty detect value matches any value. Naming a target tag hands it to the plugin: an empty value for a verdict means the tag does not belong on the file and is removed from it. The verdict is written even when this section gates all other tags away."
"classical.write_tag" = "Write verdict to:"
"classical.value" = "Value when classical:"
"classical.negative_value" = "Value when not classical:"
"preview.classical_yes" = "Classical — rule %d matched"
"preview.classical_no" = "Not classical — no rule matched"
"preview.signal_yes" = "yes"
"preview.signal_no" = "no"
"preview.classical_unjudged" = "No verdict — every rule needs a signal Picard is not fetching, so nothing is gated"
"preview.signal_unavailable" = "unknown (Picard is not fetching this data)"
"preview.tagged_unavailable" = "not checked (the preview has no files)"

