"section.classical.label" = "Classical detection"
"section.classical.note" = "Decides per release whether the plugin tags it at all: the release counts as classical if any rule row matches, and a row matches when every signal set to 'required' holds and none set to 'must not hold' does. With this section disabled every release is tagged. The verdict is always exported to Picard scripts as %_sc_classical% (single signals as %_sc_sig_...%). The genre signal needs 'Use genres from MusicBrainz' enabled in Picard's options."
