# Reference catalog: every translatable UI string with its English text.
# To add a language, copy this file to <language>.toml (e.g. fr.toml) and
# translate the values. Keys missing from a translation fall back to English.

"section.title.label" = "Title"
"section.title.note" = "Canonical = the recording's title, credited = the track title as printed on this release."
"section.artist.label" = "Artist"
"section.artist.note" = "The release credit, adjusted by the role rules below (default: composers removed)."
"section.albumartist.label" = "Album artist"
"section.artists.label" = "Artists"
"section.artists.note" = "The full release credit, including the composer."
"section.composer.label" = "Composer"
"section.composer.note" = "From the composer relationship of the performed work, written to the standard composer/composersort tags. Existing values are replaced by default; choose another policy to preserve them."
"section.conductor.label" = "Conductor"
"section.conductor.note" = "Written to the standard 'conductor' tag. Existing values are replaced by default; choose another policy to preserve them."
"section.orchestra.label" = "Orchestra"
"section.orchestra.note" = "From the 'performing orchestra' relationship. 'ensemble' is the classical tag understood by players like MPD, Roon or Squeezebox; 'performer:orchestra' is Picard's own tag for this relationship."
"section.location.label" = "Recording location"
"section.location.note" = "From the recording's 'recorded at' place relationship (e.g. the church whose organ was played). 'location' is understood e.g. by MPD. Needs one extra MusicBrainz request per album."
"section.recdate.label" = "Recording date"
"section.recdate.note" = "From the performance relationship's dates or the “recorded at”/“recorded in” relationship dates, whichever is more precise (the performance relationship wins ties). Checking the place dates needs one extra MusicBrainz request per album (shared with the recording location section), skipped when the performance dates are already day-precise."
"section.work.label" = "Work && movement"
"section.key.label" = "Key"
"section.workyear.label" = "Composition year"

