"work.template_help" = "Templates: %L1% = performed work (deepest level), %L2%… = its parents, %top% = topmost work. Ranges join several levels: %top..L1{:: }% renders them in the written order, glued with the separator in braces (default '; '). Missing levels render as nothing. Tag lists may name several tags separated by ';'. The hierarchy is also available to Picard scripts as %_sc_l1%…, %_sc_top%, %_sc_depth% and %_sc_partial%."
